name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    env:
      # Pull requests from forks do not receive repository secrets, so the Sonar steps are skipped there.
      SONAR_ENABLED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: 'Checkout Github Action'
        uses: actions/checkout@master
        with:
          fetch-depth: 0
        
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Setup Java
        if: env.SONAR_ENABLED == 'true'
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
     
      - name: Install dotnet-coverage
        if: env.SONAR_ENABLED == 'true'
        run: dotnet tool install --global dotnet-coverage

      - name: Install dotnet-sonarscanner
        if: env.SONAR_ENABLED == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Sonarscanner begin
        if: env.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner begin /d:sonar.host.url=https://sonarcloud.io /o:thoenissen /k:thoenissen_Reihitsu /d:sonar.token=$SONAR_TOKEN /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build --no-incremental --configuration Release

      - name: Test
        if: env.SONAR_ENABLED == 'true'
        run: |
          for project in Reihitsu.Analyzer.Test Reihitsu.Formatter.Test Reihitsu.Core.Test Reihitsu.Cli.Test Reihitsu.Tooling.Test Reihitsu.Playground.Test Reihitsu.SelfHosting.Test; do
            dotnet-coverage collect "dotnet test src/$project/$project.csproj --no-build --configuration Release -m" -f xml -o "coverage-$project.xml"
          done
          dotnet-coverage merge coverage-*.xml -f xml -o coverage.xml --remove-input-files

      - name: Sonarscanner end
        if: env.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.login=$SONAR_TOKEN

      - name: Test (without Sonar)
        if: env.SONAR_ENABLED != 'true'
        run: dotnet test --no-build --configuration Release -m
