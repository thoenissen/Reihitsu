name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Github Action'
        uses: actions/checkout@master
        with:
          fetch-depth: 0
        
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
     
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Sonarscanner begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner begin /d:sonar.host.url=https://sonarcloud.io /o:thoenissen /k:thoenissen_Reihitsu /d:sonar.token=$SONAR_TOKEN /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build --no-incremental --configuration Release

      - name: Test (Architecture)
        # Reihitsu.ArchitectureTests loads several assemblies reflectively (ArchUnitNET) purely for static
        # inspection. Running it under dotnet-coverage records those reflectively-loaded copies as extra,
        # never-executed modules that dilute the coverage of the real, tested assemblies, so it runs
        # uninstrumented and separately from the coverage-collected test projects below.
        run: dotnet test Reihitsu.ArchitectureTests/Reihitsu.ArchitectureTests.csproj --no-build --configuration Release -m

      - name: Test
        run: |
          for project in Reihitsu.Analyzer.Test Reihitsu.Formatter.Test Reihitsu.Core.Test Reihitsu.Cli.Test Reihitsu.Tooling.Test Reihitsu.Playground.Test; do
            dotnet-coverage collect "dotnet test $project/$project.csproj --no-build --configuration Release -m" -f xml -o "coverage-$project.xml"
          done
          dotnet-coverage merge coverage-*.xml -f xml -o coverage.xml --remove-input-files

      - name: Sonarscanner end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.login=$SONAR_TOKEN
