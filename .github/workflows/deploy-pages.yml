name: Deploy Playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Publish
        run: dotnet publish Reihitsu.Playground/Reihitsu.Playground.csproj -c Release -o publish-output

      - name: Set base href for the project-pages subpath
        run: sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' publish-output/wwwroot/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish-output/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
